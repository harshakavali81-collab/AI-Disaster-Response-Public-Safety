name: Import tested standalone project source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-standalone
  cancel-in-progress: false
jobs:
  import:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Copy complete standalone project from verified source branch
        run: |
          if [ -f PROJECT.json ]; then
            echo "Project already imported; refusing to overwrite existing source."
            exit 0
          fi
          git clone --depth 1 --branch standalone-ai-disaster-response-public-safety-assistant https://github.com/harshakavali81-collab/Enterprise-AI-Intelligence-Platform-Development.git "$RUNNER_TEMP/project-source"
          rsync -a --exclude '.git/' "$RUNNER_TEMP/project-source/" ./
          test -s README.md
          test -s PROJECT.json
          test -s app/main.py
          test -s frontend/index.html
          test -s assets/cover.svg
          test -s assets/architecture.svg
          test -s assets/synthetic-trend.svg
          test -s docs/THREAT_MODEL.md
          test -s docs/workflow.mmd
          test -s tests/test_demo.py
      - name: Install and run project unit tests
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
          python cli.py
          python -m compileall -q app
      - name: Commit source, documentation, diagrams, visuals and workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "feat: import complete tested standalone public-benefit AI demo"
          git push origin HEAD:main
